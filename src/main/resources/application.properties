spring.application.name=law

spring.datasource.url=jdbc:mysql://localhost:3306/law_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Audit trail: every entity save/update/delete is recorded to audit_log,
# regardless of which service/controller triggered it. See AuditInterceptor.
spring.jpa.properties.hibernate.session_factory.interceptor=com.abhipsa.digital.law.config.AuditInterceptor

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.port=8080

jwt.secret=${JWT_SECRET:1234567890123456789012345678901234567890123456789012345678901234}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Comma-separated list of origins allowed to call this API with credentials.
# Covers local dev (Vite) and a local minikube port-forward by default. Add
# the real cluster's domain via this env var — never hardcode it in code.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

# ---------------------------------------------------------------------------
# Actuator health — split into liveness/readiness groups so Kubernetes probes
# (or the Docker Compose healthcheck) can tell "process is up" apart from
# "DB connection pool is actually ready to serve traffic".
# ---------------------------------------------------------------------------
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoints.web.exposure.include=health

# ---------------------------------------------------------------------------
# Notification dispatch (email + WhatsApp)
# Every value below reads from an environment variable first and falls back
# to a local-dev default. In Kubernetes, populate the env vars from a Secret
# (e.g. envFrom: secretRef: name: matterly-notifications) and these settings
# pick the real credentials up with no code/config changes.
# ---------------------------------------------------------------------------

# Master switch: notifications are only actually sent when this is true.
# Leave false until real SMTP/WhatsApp credentials are configured.
notification.enabled=${NOTIFICATIONS_ENABLED:false}

# --- Email (SMTP), backed by spring-boot-starter-mail ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
notification.email.from=${NOTIFICATION_EMAIL_FROM:no-reply@matterly.in}

# --- WhatsApp, via Twilio's WhatsApp API ---
notification.whatsapp.provider=${WHATSAPP_PROVIDER:twilio}
notification.whatsapp.account-sid=${TWILIO_ACCOUNT_SID:}
notification.whatsapp.auth-token=${TWILIO_AUTH_TOKEN:}
notification.whatsapp.from-number=${TWILIO_WHATSAPP_FROM:}

# Notice document / postal receipt uploads are stored as binary (LONGBLOB) in
# the database, so raise the default multipart limits to fit scanned PDFs.
spring.servlet.multipart.max-file-size=${NOTICE_UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${NOTICE_UPLOAD_MAX_REQUEST_SIZE:20MB}


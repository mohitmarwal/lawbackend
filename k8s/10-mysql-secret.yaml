# CHANGE THIS before applying. Easiest way to set your own value without
# committing it to git:
#   kubectl create secret generic mysql-secret -n matterly \
#     --from-literal=root-password='your-real-password' \
#     --dry-run=client -o yaml > k8s/10-mysql-secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: matterly
type: Opaque
stringData:
  root-password: changeme

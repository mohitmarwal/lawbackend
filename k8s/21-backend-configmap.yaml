apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: matterly
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/law_db?useSSL=false&allowPublicKeyRetrieval=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC"
  SPRING_DATASOURCE_USERNAME: "root"
  # Comma-separated, no spaces needed either way. Covers local dev + a local
  # minikube port-forward. Before pointing this at a real cluster, add that
  # domain here too, e.g. "https://matterly.example.com" — no code change.
  CORS_ALLOWED_ORIGINS: "http://localhost:5173,http://localhost:8081"
  NOTIFICATIONS_ENABLED: "false"
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"

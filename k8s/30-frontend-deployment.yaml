apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: matterly
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Build from ./Lawfrontend/lawreact/lawyer-ui/Dockerfile with
          #   --build-arg VITE_API_BASE_URL=
          # (empty — same-origin, proxied by nginx) and push/load it the
          # same way as the backend image above.
          image: matterly-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20
